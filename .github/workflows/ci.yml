name: Nexora CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: KMP Shared Logic & Android Application
  # -------------------------------------------------------------
  android-and-shared:
    name: KMP Core & Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GROQ_API_KEY=" >> local.properties
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> local.properties

      - name: Run Shared KMP Unit Tests
        run: ./gradlew :sharedLogic:allTests --stacktrace

      - name: Build Android Debug Application
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build Optional Local Ktor Backend
        run: ./gradlew :backend:build --stacktrace

  # -------------------------------------------------------------
  # Job 2: iOS Shared Framework & Native SwiftUI App (macOS Runner)
  # -------------------------------------------------------------
  ios-build:
    name: iOS Framework & SwiftUI Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI local.properties
        run: |
          echo "GROQ_API_KEY=" >> local.properties
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> local.properties

      - name: Build KMP iOS Shared Framework (Simulator ARM64)
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build iOS SwiftUI Application with xcodebuild
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
